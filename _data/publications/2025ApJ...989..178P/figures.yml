figures:
- id: apjadec94f1
  url: http://www.astroexplorer.org/details/apjadec94f1
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f1_hr.jpg
  caption: '<strong>Figure 1.</strong> Top: the stellar mass–<em>Z</em>–<em>α</em>
    relation for simulated satellites in the intermediate- to high-mass range (<em>M</em><sub>*,in</sub>
    ≥ 10<sup>5</sup><em> M</em><sub>⊙</sub>) where satellites are colored by quenching
    and survival status. Disrupted satellites are shown in gray open symbols. Surviving
    star-forming satellites are shown in filled blue symbols, satellites quenched
    by the host are in red, and satellites quenched &gt;1 Gyr prior to infall are
    in orange. Surviving galaxies that have fewer than 95% of their infall stars and
    thus likely to be in the process of tidal disruption are marked by transparent
    colored markers. Mint resolution satellites, Near Mint <tt>Sandra</tt> and <tt>Elena</tt>,
    and Near Mint <tt>Ruth</tt> and <tt>Sonia</tt> satellites are shown in large circles,
    small circles, and small triangles, respectively. Observed satellites are included
    in green, where stellar masses from surviving satellites are derived from J. D.
    Simon (2019) using a mass-to-light ratio of one and <em>M</em><sub><em>V</em>,⊙</sub>&nbsp;=&nbsp;4.8,
    and the [Fe/H] values are also from J. D. Simon (2019). Disrupted satellites (green
    open pluses) and Sagittarius (green open diamond) are compiled from R. P. Naidu
    et al. (2022). All [O/Fe] values from the observations are set to the [<em>α</em>/Fe]
    values from R. P. Naidu et al. (2022). For all surviving and disrupted satellites
    ≥10<sup>5</sup><em> M</em><sub>⊙</sub>, we provide the binned medians (light pink
    and gray lines, respectively), 16th–84th percentile range (pink and gray hatches),
    and the corresponding least squares fit to the binned medians (dark purple and
    gray lines). Bottom: similar to the top row, but for our full sample of satellites
    including observed ultrafaint dwarfs (UFDs). Our simulations appear consistent
    with the overall <em>M</em>–<em>Z</em>–<em>α</em> trend for satellites around
    the Milky Way, and successfully reproduce the relatively metal-poor but <em>α</em>-enhanced
    population of disrupted satellites. The same best-fit lines for satellites ≥10<sup>5</sup><em>
    M</em><sub>⊙</sub> are replotted for comparison.'
- id: apjadec94f2
  url: http://www.astroexplorer.org/details/apjadec94f2
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f2_hr.jpg
  caption: '<strong>Figure 2.</strong> Left: CDF of infall stellar masses <em>M</em><sub>*,in</sub>
    of the Mint resolution sample. Using a similar coloring scheme as in Figure <a
    href="http://www.astroexplorer.org/details/apjadec94f1" rel="noopener noreferrer">1</a>,
    the CDF of disrupted satellites is indicated in gray, while the contribution to
    surviving satellites from star-forming satellites, satellites quenched by the
    host, and satellites quenched &gt;1 Gyr prior to infall are indicated in blue,
    red, and orange, respectively. The stacked CDFs of these three categories (indicated
    by the thick black line) make up the total surviving satellite population. Right:
    stacked histograms showing the distribution of <em>M</em><sub>*,in</sub> between
    surviving and disrupted satellites. We separate the surviving satellites by quenching
    status, as in the left panel.'
- id: apjadec94f3
  url: http://www.astroexplorer.org/details/apjadec94f3
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f3_hr.jpg
  caption: '<strong>Figure 3.</strong> Left: stellar masses at infall (<em>M</em><sub>*,in</sub>)
    and the lookback time to infall for our full sample, using the same color scheme
    as Figure <a href="http://www.astroexplorer.org/details/apjadec94f1" rel="noopener
    noreferrer">1</a>. Horizontal bars extending out to the time of disruption are
    shown for each disrupted satellite (open symbols). As in Figure <a href="http://www.astroexplorer.org/details/apjadec94f1"
    rel="noopener noreferrer">1</a>, observations are indicated by pluses, Mint resolution
    simulated satellites are indicated by large circles, and satellites from the Near
    Mint (lower-resolution) runs are indicated by smaller symbols (<tt>Sandra</tt>
    and <tt>Elena</tt> in circles, <tt>Ruth </tt>and <tt>Sonia</tt> in triangles).
    Observed surviving satellites, shown as filled green pluses, have stellar masses
    derived from J. D. Simon (2019) as in Figure <a href="http://www.astroexplorer.org/details/apjadec94f1"
    rel="noopener noreferrer">1</a>, and infall times from S. P. Fillingham et al.
    (2019). Data for disrupted galaxies (shown as empty green pluses) are from R.
    P. Naidu et al. (2022). Surviving satellites that retain &lt;95% of the stars
    they accreted with at <em>z</em> = 0 are indicated in lower-opacity symbols. Right:
    similar to the left panel, now showing the maximum virial mass of the satellites
    instead of the stellar mass at infall.'
- id: apjadec94f4
  url: http://www.astroexplorer.org/details/apjadec94f4
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f4_hr.jpg
  caption: <strong>Figure 4.</strong> Lookback time to infall and quenching for all
    simulated satellites, colored by their stellar mass at infall. The top shaded
    region highlights the rough time of reionization. The outlines of the simulated
    points follow the convention from Figure <a href="http://www.astroexplorer.org/details/apjadec94f1"
    rel="noopener noreferrer">1</a>, with disrupted satellites in fainter dashed gray
    outlines, and surviving star-forming, quenched by host, and quenched &gt;1 Gyr
    prior to infall satellites are indicated in solid blue, red, and orange outlines,
    respectively. Both Mint (large circles) and Near Mint (smaller circles and triangles)
    are included for comparison with the observed patterns in infall and quenching
    time for Milky Way satellites. Observed satellites, shown as filled green pluses,
    are from S. P. Fillingham et al. (2019) and disrupted galaxies are from R. P.
    Naidu et al. (2022). Star-forming satellites are indicated at the bottom of the
    figure with a lookback <em>t</em><sub>Q</sub>&nbsp;=&nbsp;0 and blue arrows as
    a lower bound for <em>t</em><sub>Q</sub>. The gray dashed line indicates the 1:1
    line.
- id: apjadec94f5
  url: http://www.astroexplorer.org/details/apjadec94f5
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f5_hr.jpg
  caption: '<strong>Figure 5.</strong> Top row: tracking satellite orbital trajectories
    starting 1 Gyr prior to infall for all satellites from the Mint simulations binned
    by stellar mass at infall. Orbits are centered on the center of mass of the host
    (gray dot). Black lines show the orbits of disrupted galaxies as they sink to
    the center and merge with the host, and solid color lines show surviving galaxies,
    with line colors corresponding to the convention in Figure <a href="http://www.astroexplorer.org/details/apjadec94f1"
    rel="noopener noreferrer">1</a>. Position data for satellites are interpolated
    across snapshots until disruption (merger with host) for disrupted satellites
    and <em>z</em> = 0 for surviving satellites. From left to right, each figure corresponds
    to a different infall stellar mass bin: ultralow (<em>M</em><sub>*</sub>&nbsp;&lt;&nbsp;10<sup>4
    </sup><em>M</em><sub>⊙</sub>), low (10<sup>4</sup><em> M</em><sub>⊙</sub> ≤ <em>M</em><sub>*</sub>&nbsp;&lt;&nbsp;10<sup>6</sup><em>
    M</em><sub>⊙</sub>), intermediate (10<sup>6</sup><em> M</em><sub>⊙</sub> ≤ <em>M</em><sub>*</sub>&nbsp;&lt;&nbsp;10<sup>8</sup><em>
    M</em><sub>⊙</sub>), and high (<em>M</em><sub>*</sub> ≥ 10<sup>8</sup><em> M</em><sub>⊙</sub>).
    Second row: tracking the interpolated radial distance from the central host as
    a function of time for all Mint resolution satellites up until disruption or <em>z</em>
    = 0. The evolution of the virial radii of the two Mint hosts are indicated in
    cyan. Third row: the virial mass of each Mint satellite up until disruption or
    <em>z</em> = 0. Bottom row: the stellar mass of each Mint satellite as a function
    of time.'
- id: apjadec94f6
  url: http://www.astroexplorer.org/details/apjadec94f6
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f6_hr.jpg
  caption: '<strong>Figure 6.</strong> Left: the fraction of total velocity in the
    radial direction at infall, <em>v</em><sub>rad,in</sub>/<em>v</em><sub>tot,in</sub>,
    for satellites as a function of their lookback time to infall, for Mint satellites.
    Point color and styles are as in Figure <a href="http://www.astroexplorer.org/details/apjadec94f3"
    rel="noopener noreferrer">3</a>. The size of each point scales logarithmically
    with the stellar mass of the satellite at infall as shown to the right, with more
    massive satellites in larger markers. Horizontal lines out to the time of disruption
    are included for disrupted satellites. Center: similar to the left panel, for
    Near Mint satellites, where circles are used for satellites of <tt>Sandra</tt>
    and <tt>Elena</tt>, and triangles for <tt>Ruth</tt> and <tt>Sonia</tt>. Right:
    the fraction of total Mint (light blue) and Near Mint (orange) satellites that
    survive, binned as a function of <em>v</em><sub>rad,in</sub>/<em>v</em><sub>tot,in</sub>.'
- id: apjadec94f7
  url: http://www.astroexplorer.org/details/apjadec94f7
  image_path: https://s3.amazonaws.com/aasie/images/0004-637X/989/2/null/apjadec94f7_hr.jpg
  caption: '<strong>Figure 7.</strong> Top left: fraction of virial mass lost since
    infall as a function of lookback time to infall for Mint satellites. Marker colors
    and sizes are as in Figure <a href="http://www.astroexplorer.org/details/apjadec94f6"
    rel="noopener noreferrer">6</a>, where disrupted satellites have mass-loss fractions
    of one. Top middle: fraction of stellar mass lost since infall as a function of
    lookback time to infall for Mint satellites. Fractions of star particles lost
    since infall (which includes mass loss due to stellar evolution) are indicated
    in the corresponding open circles. Negative values indicate a growth in stellar
    mass since infall. Top right: fraction of gas mass lost since infall as a function
    of lookback time to infall for Mint satellites. Many satellites infell with no
    gas, and are hence excluded from this panel. Bottom row: similar to the panels
    in the top row, but for all Near Mint satellites for comparison.'
