figures:
- id: apjlac13a7f1
  url: http://www.astroexplorer.org/details/apjlac13a7f1
  image_path: https://s3.amazonaws.com/aasie/images/2041-8205/916/2/L23/apjlac13a7f1_hr.jpg
  caption: '<strong>Figure 1.</strong> Star formation histories for the four galaxy
    populations. For the star-forming population we only show 80 randomly drawn galaxies,
    for clarity. The curves are binned over 100 Myr and normalized by the total mass
    formed by <em>z</em> = 2. In each panel, a thick line marks the median trend.
    The data and software to generate this Figure are available on Zenodo:10.5281/zenodo.5093727
    (GitHub: <a href="https://github.com/pathakde/Pathak_2021" rel="noopener noreferrer">https://github.com/pathakde/Pathak_2021</a>).'
- id: apjlac13a7f2
  url: http://www.astroexplorer.org/details/apjlac13a7f2
  image_path: https://s3.amazonaws.com/aasie/images/2041-8205/916/2/L23/apjlac13a7f2_hr.jpg
  caption: '<strong>Figure 2.</strong> The first three panels show the effective sizes
    calculated in the rest-frame <em>U</em>-band, rest-frame <em>V</em>-band, and
    using the stellar mass distribution, as a function of total stellar mass. Galaxies
    are color-coded according to the populations defined in Section 2.2. For the star-forming
    population we only show 80 randomly drawn galaxies; we also omit the intermediate
    quiescent population from the first three panels for clarity. Stars mark the median
    values for each population. The last panel shows the ratio of half-mass and half-light
    (in the rest-frame <em>V</em>-band) size as a function of stellar age, for the
    three subsamples of quiescent galaxies. Star symbols mark the medians for the
    TNG galaxies, and empty circles mark the medians for the Suess et al. (2020) observed
    sample at 1.5 &lt; <em>z</em> &lt; 2.5. The 30th–70th percentile regions for both
    the simulation (hatched) and observations (shaded) are shown. The data and software
    to generate this Figure are available on Zenodo:10.5281/zenodo.5093727 (GitHub:
    <a href="https://github.com/pathakde/Pathak_2021" rel="noopener noreferrer">https://github.com/pathakde/Pathak_2021</a>).'
- id: apjlac13a7f3
  url: http://www.astroexplorer.org/details/apjlac13a7f3
  image_path: https://s3.amazonaws.com/aasie/images/2041-8205/916/2/L23/apjlac13a7f3_hr.jpg
  caption: '<strong>Figure 3.</strong> Radial age profiles for the four galaxy populations
    (thin lines). For the star-forming population we only show 80 randomly drawn galaxies,
    for clarity. The median for each population is shown in thick unbroken lines.
    The median for the main progenitors at <em>z</em> = 3 (thick dotted line) and
    the descendants at <em>z</em> = 1.5 (thick dashed line) are also shown. The data
    and software to generate this Figure are available on Zenodo:10.5281/zenodo.5093727
    (GitHub: <a href="https://github.com/pathakde/Pathak_2021" rel="noopener noreferrer">https://github.com/pathakde/Pathak_2021</a>).'
- id: apjlac13a7f4
  url: http://www.astroexplorer.org/details/apjlac13a7f4
  image_path: https://s3.amazonaws.com/aasie/images/2041-8205/916/2/L23/apjlac13a7f4_hr.jpg
  caption: '<strong>Figure 4.</strong> Age profiles of young quiescent galaxies, with
    separate panels for galaxies with at least one significant merger that contributes
    at least 10% of the <em>z</em> = 2 stellar mass (“with merger”: left panel) and
    those without such a merger (right panel). The data and software to generate this
    Figure are available on Zenodo:10.5281/zenodo.5093727 (GitHub: <a href="https://github.com/pathakde/Pathak_2021"
    rel="noopener noreferrer">https://github.com/pathakde/Pathak_2021</a>).'
- id: apjlac13a7f5
  url: http://www.astroexplorer.org/details/apjlac13a7f5
  image_path: https://s3.amazonaws.com/aasie/images/2041-8205/916/2/L23/apjlac13a7f5_hr.jpg
  caption: '<strong>Figure 5.</strong> Stacked normalized histograms showing the radial
    distribution of stellar ages in each galaxy population. All stellar particles
    of all galaxies in a given population are split into five age bins; the colored
    bands show the fractional contribution of each bin to the total stellar mass,
    as a function of radius. Galaxies are divided according to whether they experienced
    (bottom row) or did not experience (top row) a significant merger prior to <em>z</em>
    = 2. The number of galaxies in each category are indicated in brackets. The data
    and software to generate this Figure are available on Zenodo: 10.5281/zenodo.5093727
    (GitHub: <a href="https://github.com/pathakde/Pathak_2021" rel="noopener noreferrer">https://github.com/pathakde/Pathak_2021</a>).'
