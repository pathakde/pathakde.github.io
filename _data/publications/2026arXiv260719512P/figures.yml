    the center of NGC1512 from <cite>Querejeta<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib19"
    rel="noopener noreferrer" title="Stellar structures, molecular gas, and star formation
    across the PHANGS sample of nearby galaxies">2021</a>)</cite>.

    '
- id: S2.F6
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S2.F6" rel="noopener
    noreferrer"><img alt="Refer to caption" height="154" src="https://arxiv.org/html/2607.19512v1/radial_profile_STARSUB_filters_Mstar.png"
    width="476"/></a>
  caption: '<span>Figure 6: </span><span>Top</span>: Radial profiles of F300M, F770W<sub>ss</sub>,
    F2100W<sub>ss</sub> intensity for all 71 galaxies; F1000W<sub>ss</sub> and F1130W<sub>ss</sub>
    for 20 galaxies, colored by galaxy stellar mass <math alttext="M_{*}" display="inline"
    id="S2.F6.18.17.m5"><semantics><msub><mi>M</mi><mo>∗</mo></msub><annotation encoding="application/x-tex">M_{*}</annotation></semantics></math>.

    <span>Bottom</span>: Median (solid lines) and <math alttext="16^{\rm th}{-}84^{\rm
    th}" display="inline" id="S2.F6.19.18.m6"><semantics><mrow><msup><mn>16</mn><mi>th</mi></msup><mo>−</mo><msup><mn>84</mn><mi>th</mi></msup></mrow><annotation
    encoding="application/x-tex">16^{\rm th}{-}84^{\rm th}</annotation></semantics></math>
    percentile range (shaded region) of radial profiles of F300M, F770W<sub>ss</sub>,
    F2100W<sub>ss</sub>, F1000W<sub>ss</sub> and F1130W<sub>ss</sub> in six percentile
    bins of <math alttext="M_{*}" display="inline" id="S2.F6.24.23.m11"><semantics><msub><mi>M</mi><mo>∗</mo></msub><annotation
    encoding="application/x-tex">M_{*}</annotation></semantics></math>.

    All radial profiles shown as a function of (projected) galactocentric radius in
    units of galaxy exponential scale-length <math alttext="\ell_{*}" display="inline"
    id="S2.F6.25.24.m12"><semantics><msub><mi>ℓ</mi><mo>∗</mo></msub><annotation encoding="application/x-tex">\ell_{*}</annotation></semantics></math>.'
- id: S3.F7
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S3.F7" rel="noopener
    noreferrer"><img alt="Refer to caption" height="249" src="https://arxiv.org/html/2607.19512v1/radial_profile_ratios_Mstar.png"
    width="476"/></a>
  caption: '<span>Figure 7: </span>Radial profiles of <math alttext="\log R_{\rm PAH}^{*}"
    display="inline" id="S3.F7.7.6.m1"><semantics><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup></mrow><annotation
    encoding="application/x-tex">\log R_{\rm PAH}^{*}</annotation></semantics></math>
    for individual galaxies colored by total <math alttext="M_{*}" display="inline"
    id="S3.F7.8.7.m2"><semantics><msub><mi>M</mi><mo>∗</mo></msub><annotation encoding="application/x-tex">M_{*}</annotation></semantics></math>
    (left), and then median profiles for groups of galaxies sorted into percentile
    bins of <math alttext="M_{*}" display="inline" id="S3.F7.9.8.m3"><semantics><msub><mi>M</mi><mo>∗</mo></msub><annotation
    encoding="application/x-tex">M_{*}</annotation></semantics></math> (right). All
    galactocentric distances for the radial profiles are shown in units of the exponential
    scale length <math alttext="\ell_{*}" display="inline" id="S3.F7.10.9.m4"><semantics><msub><mi>ℓ</mi><mo>∗</mo></msub><annotation
    encoding="application/x-tex">\ell_{*}</annotation></semantics></math>. For each
    binned profile, the median profile within a bin (solid line) and <math alttext="16^{\rm
    th}{-}84^{\rm th}" display="inline" id="S3.F7.11.10.m5"><semantics><mrow><msup><mn>16</mn><mi>th</mi></msup><mo>−</mo><msup><mn>84</mn><mi>th</mi></msup></mrow><annotation
    encoding="application/x-tex">16^{\rm th}{-}84^{\rm th}</annotation></semantics></math>
    percentile range (shaded area) are included. Diffuse ISM median for 19/71 of our
    targets from <cite>Sutter<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib11"
    rel="noopener noreferrer" title="The Fraction of Dust Mass in the Form of Polycyclic
    Aromatic Hydrocarbons on 10–50 pc Scales in Nearby Galaxies">2024</a>)</cite>
    shown as horizontal black dot-dashed lines.

    '
- id: S3.F8
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S3.F8" rel="noopener
    noreferrer"><img alt="Refer to caption" height="177" src="https://arxiv.org/html/2607.19512v1/sSFR_vs_radial_profile_plateau.png"
    width="229"/></a>
  caption: '<span>Figure 8: </span>Plateau value in radial profiles of <math alttext="\log
    R_{\rm PAH}^{*}" display="inline" id="S3.F8.6.5.m1"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup></mrow><annotation
    encoding="application/x-tex">\log R_{\rm PAH}^{*}</annotation></semantics></math>
    for each galaxy, measured as the median of all <math alttext="0.1\ell_{*}" display="inline"
    id="S3.F8.7.6.m2"><semantics><mrow><mn>0.1</mn><mo lspace="0em" rspace="0em">​</mo><msub><mi>ℓ</mi><mo>∗</mo></msub></mrow><annotation
    encoding="application/x-tex">0.1\ell_{*}</annotation></semantics></math> annular
    bins with <math alttext="\ell_{*}\leq R_{\rm gal}\leq 3\ell_{*}" display="inline"
    id="S3.F8.8.7.m3"><semantics><mrow><msub><mi>ℓ</mi><mo>∗</mo></msub><mo>≤</mo><msub><mi>R</mi><mi>gal</mi></msub><mo>≤</mo><mrow><mn>3</mn><mo
    lspace="0em" rspace="0em">​</mo><msub><mi>ℓ</mi><mo>∗</mo></msub></mrow></mrow><annotation
    encoding="application/x-tex">\ell_{*}\leq R_{\rm gal}\leq 3\ell_{*}</annotation></semantics></math>,
    points colored by galaxy stellar mass, as a function of global sSFR. Median of
    71 galaxies (orange solid line), <math alttext="1\sigma" display="inline" id="S3.F8.9.8.m4"><semantics><mrow><mn>1</mn><mo
    lspace="0em" rspace="0em">​</mo><mi>σ</mi></mrow><annotation encoding="application/x-tex">1\sigma</annotation></semantics></math>
    scatter (orange hatched area), diffuse ISM median from <cite>Sutter<span> et al.</span>
    (<a href="https://arxiv.org/html/2607.19512v1#bib.bib11" rel="noopener noreferrer"
    title="The Fraction of Dust Mass in the Form of Polycyclic Aromatic Hydrocarbons
    on 10–50 pc Scales in Nearby Galaxies">2024</a>, horizontal black dot-dashed line)</cite>,
    and Spearman rank correlation coefficient (printed) shown. See Table <a href="https://arxiv.org/html/2607.19512v1#S3.T1"
    rel="noopener noreferrer" title="Table 1 ‣ III.2 Roughly constant 𝑅_PAH^∗ in Normal
    Star-Forming Disks ‣ III Mid-IR Colors in Galaxies ‣ Mid-Infrared Colors Vary
    with Galactic Environment: Contrasting Star-Forming Disks, Young Centers, and
    Quiescent Star-Formation Deserts"><span>1</span></a>.

    '
- id: S3.F9
  figure_content: '<a href="https://arxiv.org/html/2607.19512v1#S3.F9" rel="noopener
    noreferrer"><div>

    <div><img alt="Refer to caption" height="133" src="https://arxiv.org/html/2607.19512v1/err_MUSE_logSFR_vs_JWST_colors_in_center_pix_ALL.png"
    width="476"/></div>

    <div></div>

    <div><img alt="Refer to caption" height="133" src="https://arxiv.org/html/2607.19512v1/err_MUSE_logsSFR_vs_JWST_colors_in_center_pix_ALL.png"
    width="476"/></div>

    <div></div>

    <div><img alt="Refer to caption" height="133" src="https://arxiv.org/html/2607.19512v1/err_JWST_colors_in_center_pix_ALL.png"
    width="476"/></div>

    </div></a>'
  caption: '<span>Figure 9: </span><math alttext="\log R_{\rm PAH}^{*}" display="inline"
    id="S3.F9.12.9.m1"><semantics><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup></mrow><annotation
    encoding="application/x-tex">\log R_{\rm PAH}^{*}</annotation></semantics></math>,
    <math alttext="\log\rm F770W_{ss}/F1130W_{ss}" display="inline" id="S3.F9.13.10.m2"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mrow><msub><mi>F770W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F1130W</mi><mi>ss</mi></msub></mrow></mrow><annotation
    encoding="application/x-tex">\log\rm F770W_{ss}/F1130W_{ss}</annotation></semantics></math>,
    and <math alttext="\log\rm F1000W_{ss}/F2100W_{\rm ss}" display="inline" id="S3.F9.14.11.m3"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mrow><msub><mi>F1000W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F2100W</mi><mi>ss</mi></msub></mrow></mrow><annotation
    encoding="application/x-tex">\log\rm F1000W_{ss}/F2100W_{\rm ss}</annotation></semantics></math>
    as a function of <math alttext="\log\rm\Sigma_{SFR}~(M_{\odot}\,yr^{-1}\,kpc^{-2};~top)"
    display="inline" id="S3.F9.15.12.m4"><semantics><mrow><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><msub><mi>Σ</mi><mi>SFR</mi></msub></mrow><mo
    lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mrow><msub><mi>M</mi><mo>⊙</mo></msub><mo
    lspace="0em" rspace="0em">​</mo><msup><mi>yr</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    lspace="0em" rspace="0em">​</mo><msup><mi>kpc</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow><mo
    rspace="0.497em">;</mo><mi>top</mi><mo stretchy="false">)</mo></mrow></mrow><annotation
    encoding="application/x-tex">\log\rm\Sigma_{SFR}~(M_{\odot}\,yr^{-1}\,kpc^{-2};~top)</annotation></semantics></math>
    and <math alttext="\log\rm sSFR=\log\Sigma_{SFR}/\Sigma_{*}~(yr^{-1};~middle)"
    display="inline" id="S3.F9.16.13.m5"><semantics><mrow><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><mi>sSFR</mi></mrow><mo>=</mo><mrow><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mrow><msub><mi>Σ</mi><mi>SFR</mi></msub><mo>/</mo><msub><mi>Σ</mi><mo>∗</mo></msub></mrow></mrow><mo
    lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><msup><mi>yr</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    rspace="0.497em">;</mo><mi>middle</mi><mo stretchy="false">)</mo></mrow></mrow></mrow><annotation
    encoding="application/x-tex">\log\rm sSFR=\log\Sigma_{SFR}/\Sigma_{*}~(yr^{-1};~middle)</annotation></semantics></math>
    from MUSE, and <math alttext="\log\rm F2100W/F300M" display="inline" id="S3.F9.17.14.m6"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mrow><mi>F2100W</mi><mo>/</mo><mi>F300M</mi></mrow></mrow><annotation
    encoding="application/x-tex">\log\rm F2100W/F300M</annotation></semantics></math>
    (bottom row), split by local environment—old stellar bulges (red), young CMZs
    (bright blue), normal centers (pale blue), and disks (yellow). The markers indicate
    medians within each environment, with corresponding Spearman rank correlation
    coefficients (<math alttext="\rho" display="inline" id="S3.F9.18.15.m7"><semantics><mi>ρ</mi><annotation
    encoding="application/x-tex">\rho</annotation></semantics></math>) printed. We
    indicate the 20 galaxies with coverage in all four MIRI filters as X’s, and the
    rest with only two MIRI filters as circles.

    For galaxy centers, we include medians within the full environment (X’s or circles)
    and selecting for only diffuse emission (blue triangles), and mark centers with
    known AGN <cite>(open squares; Véron-Cetty and Véron, <a href="https://arxiv.org/html/2607.19512v1#bib.bib77"
    rel="noopener noreferrer" title="A catalogue of quasars and active nuclei: 13th
    edition">2010</a>)</cite>. The median diffuse <math alttext="R_{\rm PAH}^{*}"
    display="inline" id="S3.F9.19.16.m8"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math> from
    <cite>Sutter<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib11"
    rel="noopener noreferrer" title="The Fraction of Dust Mass in the Form of Polycyclic
    Aromatic Hydrocarbons on 10–50 pc Scales in Nearby Galaxies">2024</a>)</cite>
    is included for comparison (black dot-dashed line).

    '
- id: S3.F10
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S3.F10" rel="noopener
