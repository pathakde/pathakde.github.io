    with <cite>Querejeta<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib19"
    rel="noopener noreferrer" title="Stellar structures, molecular gas, and star formation
    across the PHANGS sample of nearby galaxies">2021</a>)</cite> morphological environment
    masks for centers (blue) and bars (red)

    overlaid for reference.'
- id: S2.F2
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S2.F2" rel="noopener
    noreferrer"><img alt="Refer to caption" height="207" src="https://arxiv.org/html/2607.19512v1/sSFR_SigmaSFR_vs_F2100W_F300M.png"
    width="476"/></a>
  caption: '<span>Figure 2: </span>Correlating environment-integrated median <math
    alttext="\Sigma_{\rm SFR}" display="inline" id="S2.F2.7.6.m1"><semantics><msub><mi>Σ</mi><mi>SFR</mi></msub><annotation
    encoding="application/x-tex">\Sigma_{\rm SFR}</annotation></semantics></math>
    (<math alttext="M_{\odot}\,\rm yr^{-1}\,kpc^{-1}" display="inline" id="S2.F2.8.7.m2"><semantics><mrow><msub><mi>M</mi><mo>⊙</mo></msub><mo
    lspace="0.170em" rspace="0em">​</mo><msup><mi>yr</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo
    lspace="0em" rspace="0em">​</mo><msup><mi>kpc</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation
    encoding="application/x-tex">M_{\odot}\,\rm yr^{-1}\,kpc^{-1}</annotation></semantics></math>;  and
    sSFR (<math alttext="\rm yr^{-1}" display="inline" id="S2.F2.9.8.m3"><semantics><msup><mi>yr</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><annotation
    encoding="application/x-tex">\rm yr^{-1}</annotation></semantics></math>;  measurements
    from MUSE with JWST F2100W intensities and F2100W/F300M, respectively, for the
    42 galaxies with joint MUSE and JWST coverage. Environments (§<a href="https://arxiv.org/html/2607.19512v1#S2.SS3"
    rel="noopener noreferrer" title="II.3 Environmental Classification ‣ II Data and
    Methods ‣ Mid-Infrared Colors Vary with Galactic Environment: Contrasting Star-Forming
    Disks, Young Centers, and Quiescent Star-Formation Deserts"><span>II.3</span></a>)
    are indicated with colors — old bulges (red), young star-forming centers (blue),
    normal centers (light blue), and normal disks (light yellow) for targets with
    full MIRI filter coverage (20/71; X’s) and partial filter coverage (51/71; circles).
    We include <math alttext="\log{-}\log" display="inline" id="S2.F2.10.9.m4"><semantics><mrow><mi>log</mi><mo
    lspace="0em">−</mo><mi>log</mi></mrow><annotation encoding="application/x-tex">\log{-}\log</annotation></semantics></math>
    fits to all environments (light grey); the corresponding correlation coefficient
    <math alttext="\rho" display="inline" id="S2.F2.11.10.m5"><semantics><mi>ρ</mi><annotation
    encoding="application/x-tex">\rho</annotation></semantics></math> and p-value;
    and the threshold in F2100W nd F2100W/F300M sed to classify young centers (dark
    blue) and old bulges (red) as in §<a href="https://arxiv.org/html/2607.19512v1#S2.SS3"
    rel="noopener noreferrer" title="II.3 Environmental Classification ‣ II Data and
    Methods ‣ Mid-Infrared Colors Vary with Galactic Environment: Contrasting Star-Forming
    Disks, Young Centers, and Quiescent Star-Formation Deserts"><span>II.3</span></a>
    are indicated as horizontal dashed lines.

    '
- id: S2.F3
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S2.F3" rel="noopener
    noreferrer"><img alt="Refer to caption" height="195" src="https://arxiv.org/html/2607.19512v1/x7.png"
    width="660"/></a>
  caption: '<span>Figure 3: </span> <span>Left</span>: Constructing radial profiles
    of <math alttext="\rm F770W_{ss}/F2100W_{ss}" display="inline" id="S2.F3.5.4.m1"><semantics><mrow><msub><mi>F770W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F2100W</mi><mi>ss</mi></msub></mrow><annotation
    encoding="application/x-tex">\rm F770W_{ss}/F2100W_{ss}</annotation></semantics></math>
    for NGC1300  The solid red line shows our fiducial measurement constructed from
    the ratio of medians taken across the full data set. The other lines show the
    impact of varying the methodology. Green shows the profile without starlight subtraction
    for all pixels (solid green), for only diffuse emission (dot-dashed green; see
    §<a href="https://arxiv.org/html/2607.19512v1#S2.SS5.SSS2" rel="noopener noreferrer"
    title="II.5.2 Measuring Mid-IR Colors of Diffuse Emission ‣ II.5 Core Measurements
    ‣ II Data and Methods ‣ Mid-Infrared Colors Vary with Galactic Environment: Contrasting
    Star-Forming Disks, Young Centers, and Quiescent Star-Formation Deserts"><span>II.5.2</span></a>),
    and constructed taking the median of pixel-wise ratios instead of the ratio of
    medians (dashed green). Other red lines show varying methodologies with star-subtraction
    applied: considering diffuse emission only (dot-dashed red), all pixels (solid
    red), or the median of pixel ratios (dashed red). Blue shows the ratio of median
    values for only nebular regions. The black dot-dashed line shows the typical value
    for the diffuse emission from <cite>Sutter<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib11"
    rel="noopener noreferrer" title="The Fraction of Dust Mass in the Form of Polycyclic
    Aromatic Hydrocarbons on 10–50 pc Scales in Nearby Galaxies">2024</a>)</cite>.

    <span>Middle</span>: Testing agreement between ratio of medians vs median of ratios
    for all radial bins, including both diffuse and nebular pixels, across 71 galaxies
    with <math alttext="R_{\rm gal}\leq 3\ell_{*}" display="inline" id="S2.F3.6.5.m2"><semantics><mrow><msub><mi>R</mi><mi>gal</mi></msub><mo>≤</mo><mrow><mn>3</mn><mo
    lspace="0em" rspace="0em">​</mo><msub><mi>ℓ</mi><mo>∗</mo></msub></mrow></mrow><annotation
    encoding="application/x-tex">R_{\rm gal}\leq 3\ell_{*}</annotation></semantics></math>.

    <span>Right</span>: Testing agreement between ratio of medians when including
    all pixels vs including diffuse pixels only (masking nebular pixels before binning)
    for all radial bins at <math alttext="R_{\rm gal}\leq 3\ell_{*}" display="inline"
    id="S2.F3.7.6.m3"><semantics><mrow><msub><mi>R</mi><mi>gal</mi></msub><mo>≤</mo><mrow><mn>3</mn><mo
    lspace="0em" rspace="0em">​</mo><msub><mi>ℓ</mi><mo>∗</mo></msub></mrow></mrow><annotation
    encoding="application/x-tex">R_{\rm gal}\leq 3\ell_{*}</annotation></semantics></math>.

    '
- id: S2.F4
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S2.F4" rel="noopener
    noreferrer"><img alt="Refer to caption" height="195" src="https://arxiv.org/html/2607.19512v1/x8.png"
    width="317"/></a>
  caption: '<span>Figure 4: </span>

    The center of NGC7496, an example of galaxy centers removed from analysis due
    to contamination by prominent diffraction spikes in F2100W. We show maps of contaminated
    F2100W and resulting <math alttext="R_{\rm PAH}^{*}" display="inline" id="S2.F4.4.3.m1"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math>,
    blue contours for the center mask from <cite>Querejeta<span> et al.</span> (<a
    href="https://arxiv.org/html/2607.19512v1#bib.bib19" rel="noopener noreferrer"
    title="Stellar structures, molecular gas, and star formation across the PHANGS
    sample of nearby galaxies">2021</a>)</cite>, and black contours for median <math
    alttext="R_{\rm PAH}^{*}" display="inline" id="S2.F4.5.4.m2"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math> in
    the center.

    '
- id: S2.F5
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S2.F5" rel="noopener
    noreferrer"><img alt="Refer to caption" height="150" src="https://arxiv.org/html/2607.19512v1/x9.png"
    width="660"/></a>
  caption: '<span>Figure 5: </span>

    From left to right, F300M, F770W<sub>ss</sub>, F2100W<sub>ss</sub>, <math alttext="R_{\rm
    PAH}^{*}" display="inline" id="S2.F5.7.6.m3"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math>,
    and resulting masks for diffuse (blue) vs nebular emission (pink) in the center
