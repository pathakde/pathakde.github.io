- id: S4.F16
  figure_content: <a href="https://arxiv.org/html/2607.19512v1#S4.F16" rel="noopener
    noreferrer"><img alt="Refer to caption" height="171" src="https://arxiv.org/html/2607.19512v1/MUSE_logsSFR_vs_Av.png"
    width="229"/></a>
  caption: '<span>Figure 16: </span>MUSE sSFR vs median (markers) and <math alttext="16^{\rm
    th}{-}84^{\rm th}" display="inline" id="S4.F16.12.11.m1"><semantics><mrow><msup><mn>16</mn><mi>th</mi></msup><mo>−</mo><msup><mn>84</mn><mi>th</mi></msup></mrow><annotation
    encoding="application/x-tex">16^{\rm th}{-}84^{\rm th}</annotation></semantics></math>
    percentile scatter (error bars) in Balmer decrement attenuation <math alttext="A_{\rm
    V}" display="inline" id="S4.F16.13.12.m2"><semantics><msub><mi>A</mi><mi>V</mi></msub><annotation
    encoding="application/x-tex">A_{\rm V}</annotation></semantics></math> for bulges,
    centers, and disks in 42 galaxies. Medians and percentiles only measured where
    both <math alttext="\rm H\alpha" display="inline" id="S4.F16.14.13.m3"><semantics><mrow><mi>H</mi><mo
    lspace="0em" rspace="0em">​</mo><mi>α</mi></mrow><annotation encoding="application/x-tex">\rm
    H\alpha</annotation></semantics></math> and <math alttext="\rm H\beta" display="inline"
    id="S4.F16.15.14.m4"><semantics><mrow><mi>H</mi><mo lspace="0em" rspace="0em">​</mo><mi>β</mi></mrow><annotation
    encoding="application/x-tex">\rm H\beta</annotation></semantics></math> are detected
    within each environment. While most low-to-moderate sSFR environments show low
    <math alttext="A_{\rm V}\approx 0.5" display="inline" id="S4.F16.16.15.m5"><semantics><mrow><msub><mi>A</mi><mi>V</mi></msub><mo>≈</mo><mn>0.5</mn></mrow><annotation
    encoding="application/x-tex">A_{\rm V}\approx 0.5</annotation></semantics></math>,
    CMZs show higher <math alttext="A_{\rm V}" display="inline" id="S4.F16.17.16.m6"><semantics><msub><mi>A</mi><mi>V</mi></msub><annotation
    encoding="application/x-tex">A_{\rm V}</annotation></semantics></math>.

    The alternate <math alttext="y" display="inline" id="S4.F16.18.17.m7"><semantics><mi>y</mi><annotation
    encoding="application/x-tex">y</annotation></semantics></math>-axis shows the
    translation to <math alttext="\tau_{\rm 10\,\mu m}" display="inline" id="S4.F16.19.18.m8"><semantics><msub><mi>τ</mi><mrow><mn>10</mn><mo
    lspace="0.170em" rspace="0em">​</mo><mi>μ</mi><mo lspace="0em" rspace="0em">​</mo><mi>m</mi></mrow></msub><annotation
    encoding="application/x-tex">\tau_{\rm 10\,\mu m}</annotation></semantics></math>,
    the optical depth at <math alttext="\rm 10\,\mu m" display="inline" id="S4.F16.20.19.m9"><semantics><mrow><mn>10</mn><mo
    lspace="0.170em" rspace="0em">​</mo><mi>μ</mi><mo lspace="0em" rspace="0em">​</mo><mi>m</mi></mrow><annotation
    encoding="application/x-tex">\rm 10\,\mu m</annotation></semantics></math> due
    to silicate absorption <cite>(using Gordon<span> et al.</span>, <a href="https://arxiv.org/html/2607.19512v1#bib.bib91"
    rel="noopener noreferrer" title="One Relation for All Wavelengths: The Far-ultraviolet
    to Mid-infrared Milky Way Spectroscopic R(V)-dependent Dust Extinction Relationship">2023</a>)</cite>,
    which in PHANGS CMZs results in <math alttext="&lt;1\%" display="inline" id="S4.F16.21.20.m10"><semantics><mrow><mi></mi><mo>&lt;</mo><mrow><mn>1</mn><mo>%</mo></mrow></mrow><annotation
    encoding="application/x-tex">&lt;1\%</annotation></semantics></math> attenuation.

    '
