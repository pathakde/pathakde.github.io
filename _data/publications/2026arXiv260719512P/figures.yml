    <math alttext="\rm F770W_{ss}/F1130W_{ss}" display="inline" id="S4.F15.6.5.m1"><semantics><mrow><msub><mi>F770W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F1130W</mi><mi>ss</mi></msub></mrow><annotation
