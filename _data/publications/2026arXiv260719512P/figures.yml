  caption: '<span>Figure 11: </span>– modified MMP (black), M31 bulge (red), and a
    3 Myr-old starburst (blue); and a 3 Myr-old starburst at <math alttext="\log U=3"
    display="inline" id="S4.F11.5.4.m1"><semantics><mrow><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><mi>U</mi></mrow><mo>=</mo><mn>3</mn></mrow><annotation
    encoding="application/x-tex">\log U=3</annotation></semantics></math>. Arrows
    show the direction in which grids shift due to increasing PAH ionization, size,
    and <math alttext="\log U" display="inline" id="S4.F11.6.5.m2"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mi>U</mi></mrow><annotation encoding="application/x-tex">\log
    U</annotation></semantics></math>. Modulo a 0.1 dex offset in F1000W between model
    grids and observations, changes in mid-IR colors for CMZs relative disks are consistent
    with increasing <math alttext="U" display="inline" id="S4.F11.7.6.m3"><semantics><mi>U</mi><annotation
    encoding="application/x-tex">U</annotation></semantics></math>, while star-formation
    deserts or bulges lie off the standard grids. fig:mir-colors-with-grids '
