    </div></a>'
  caption: '<span>Figure 13: </span><span>Top:</span> <math alttext="R_{\rm PAH}^{*}"
    display="inline" id="S4.F13.15.13.m1"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math>,
    <math alttext="\rm F770W_{ss}/F1130W_{ss}" display="inline" id="S4.F13.16.14.m2"><semantics><mrow><msub><mi>F770W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F1130W</mi><mi>ss</mi></msub></mrow><annotation
    encoding="application/x-tex">\rm F770W_{ss}/F1130W_{ss}</annotation></semantics></math>,
    and <math alttext="\rm F1000W_{ss}/F2100W_{ss}" display="inline" id="S4.F13.17.15.m3"><semantics><mrow><msub><mi>F1000W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F2100W</mi><mi>ss</mi></msub></mrow><annotation
    encoding="application/x-tex">\rm F1000W_{ss}/F2100W_{ss}</annotation></semantics></math>
    as a function of F2100W<math alttext="{}_{\rm ss}/\Sigma_{\rm Mol}" display="inline"
    id="S4.F13.18.16.m4"><semantics><mrow><mmultiscripts><mo>/</mo><mi>ss</mi><mrow></mrow></mmultiscripts><msub><mi>Σ</mi><mi>Mol</mi></msub></mrow><annotation
    encoding="application/x-tex">{}_{\rm ss}/\Sigma_{\rm Mol}</annotation></semantics></math>,
    which correlates with <math alttext="T_{\rm dust}" display="inline" id="S4.F13.19.17.m5"><semantics><msub><mi>T</mi><mi>dust</mi></msub><annotation
    encoding="application/x-tex">T_{\rm dust}</annotation></semantics></math> (and
    <math alttext="U" display="inline" id="S4.F13.20.18.m6"><semantics><mi>U</mi><annotation
    encoding="application/x-tex">U</annotation></semantics></math>). Points colored
    as in previous figures.

    <span>Bottom:</span> Predicted variation in <math alttext="R_{\rm PAH}^{*}" display="inline"
    id="S4.F13.21.19.m7"><semantics><msubsup><mi>R</mi><mi>PAH</mi><mo>∗</mo></msubsup><annotation
    encoding="application/x-tex">R_{\rm PAH}^{*}</annotation></semantics></math>,
    <math alttext="\rm F770W_{ss}/F1130W_{ss}" display="inline" id="S4.F13.22.20.m8"><semantics><mrow><msub><mi>F770W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F1130W</mi><mi>ss</mi></msub></mrow><annotation
    encoding="application/x-tex">\rm F770W_{ss}/F1130W_{ss}</annotation></semantics></math>,
    and <math alttext="\rm F1000W_{ss}/F2100W_{ss}" display="inline" id="S4.F13.23.21.m9"><semantics><mrow><msub><mi>F1000W</mi><mi>ss</mi></msub><mo>/</mo><msub><mi>F2100W</mi><mi>ss</mi></msub></mrow><annotation
    encoding="application/x-tex">\rm F1000W_{ss}/F2100W_{ss}</annotation></semantics></math>
    with radiation intensity <math alttext="\log U" display="inline" id="S4.F13.24.22.m10"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mi>U</mi></mrow><annotation encoding="application/x-tex">\log
    U</annotation></semantics></math> for three different radiation hardness models
    from <cite>Draine<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib29"
    rel="noopener noreferrer" title="Excitation of Polycyclic Aromatic Hydrocarbon
    Emission: Dependence on Size Distribution, Ionization, and Starlight Spectrum
    and Intensity">2021</a>)</cite>—a 3 Myr-old starburst (blue), modified MMP or
    Milky Way average (yellow), and the stellar bulge of M31 (red).

    At each <math alttext="\log U" display="inline" id="S4.F13.25.23.m11"><semantics><mrow><mi>log</mi><mo
    lspace="0.167em">⁡</mo><mi>U</mi></mrow><annotation encoding="application/x-tex">\log
    U</annotation></semantics></math>, we show the standard value (standard ionization
    and size; solid lines), maximum variation possible due to PAH ionization at standard
    grain size (hatches), maximum variation possible due to grain sizes at standard
    ionization (darker shading), and finally the maximum range of values possible
    at fixed <math alttext="U" display="inline" id="S4.F13.26.24.m12"><semantics><mi>U</mi><annotation
    encoding="application/x-tex">U</annotation></semantics></math> from changing both
    size and ionization in the models (light shading).

    '
