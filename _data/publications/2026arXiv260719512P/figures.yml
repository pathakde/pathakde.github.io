    grain size and ionization from <cite>Draine<span> et al.</span> (<a href="https://arxiv.org/html/2607.19512v1#bib.bib29"
    rel="noopener noreferrer" title="Excitation of Polycyclic Aromatic Hydrocarbon
    Emission: Dependence on Size Distribution, Ionization, and Starlight Spectrum
    and Intensity">2021</a>)</cite>.

    '
