[project]
name = "pathakde-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davin Lin", email = "davin.lin0810@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "coolname>=5.0.0",
    "isort>=8.0.1",
    "loguru>=0.7.3",
    "natsort>=8.4.0",
    "nh3>=0.3.7",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
pathakde-github-io = "pathakde_github_io:main"
figures = "pathakde_github_io.compile_pub_images:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
